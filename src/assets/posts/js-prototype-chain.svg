<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#00000012"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- class Dog -->
  <rect x="190" y="20" width="220" height="48" rx="8" fill="#FFF5F5" stroke="#FECACA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="49" text-anchor="middle" font-size="14" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#991B1B">class Dog { ... }</text>

  <!-- Dog.prototype -->
  <rect x="130" y="140" width="340" height="56" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="165" text-anchor="middle" font-size="14" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#075985">Dog.prototype</text>
  <text x="300" y="184" text-anchor="middle" font-size="12" font-weight="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0EA5E9">constructor: Dog · bark()</text>

  <!-- Animal.prototype -->
  <rect x="130" y="250" width="340" height="56" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="275" text-anchor="middle" font-size="14" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#166534">Animal.prototype</text>
  <text x="300" y="294" text-anchor="middle" font-size="12" font-weight="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#22C55E">constructor: Animal · eat() · sleep()</text>

  <!-- Object.prototype -->
  <rect x="130" y="360" width="340" height="56" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="385" text-anchor="middle" font-size="14" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#6B21A8">Object.prototype</text>
  <text x="300" y="404" text-anchor="middle" font-size="12" font-weight="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#A855F7">toString() · hasOwnProperty() · ...</text>

  <!-- d instance -->
  <rect x="530" y="140" width="190" height="56" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="164" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#92400E">d = new Dog("dogName")</text>
  <text x="625" y="184" text-anchor="middle" font-size="12" font-weight="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F59E0B">instance</text>

  <!-- null -->
  <text x="300" y="470" text-anchor="middle" font-size="13" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#94A3B8">null (end of chain)</text>

  <!-- Arrow: class Dog → Dog.prototype -->
  <path d="M 300 68 L 300 138" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 295 131 L 300 141 L 305 131 Z" fill="#94A3B8"/>
  <text x="316" y="105" font-size="11" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#64748B">.prototype</text>

  <!-- Arrow: d instance → Dog.prototype -->
  <path d="M 530 168 L 472 168" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 480 163 L 470 168 L 480 173 Z" fill="#94A3B8"/>
  <text x="499" y="160" text-anchor="middle" font-size="11" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#64748B">.__proto__</text>

  <!-- Arrow: Dog.prototype → Animal.prototype -->
  <path d="M 300 196 L 300 248" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 295 241 L 300 251 L 305 241 Z" fill="#94A3B8"/>
  <text x="316" y="224" font-size="11" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#64748B">.__proto__</text>

  <!-- Arrow: Animal.prototype → Object.prototype -->
  <path d="M 300 306 L 300 358" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 295 351 L 300 361 L 305 351 Z" fill="#94A3B8"/>
  <text x="316" y="334" font-size="11" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#64748B">.__proto__</text>

  <!-- Arrow: Object.prototype → null -->
  <path d="M 300 416 L 300 455" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 295 449 L 300 459 L 305 449 Z" fill="#94A3B8"/>
  <text x="316" y="439" font-size="11" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#64748B">.__proto__</text>
</svg>
